apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-copilot-ui
  labels:
    app: sre-copilot-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-copilot-ui
  template:
    metadata:
      labels:
        app: sre-copilot-ui
    spec:
      containers:
      - name: sre-copilot-ui
        image: ai-sre-sre-copilot-ui:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sre-copilot-ui
spec:
  type: LoadBalancer
  selector:
    app: sre-copilot-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
