name: AI SRE Platform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  TERRAFORM_WORKING_DIR: 'infra/terraform'
  REGISTRY: 'ghcr.io'

permissions:
  contents: read
  packages: write

jobs:
  terraform-validate:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        
      - name: Terraform Validate
        run: terraform validate
        
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  build-and-push:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: terraform-validate
    strategy:
      matrix:
        service: [ai-rca-engine, incident-summarizer, chatbot-api, alert-router, sre-copilot-ui]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Trivy Security Scan would go here
      # - name: Run Trivy vulnerability scanner
      #   uses: aquasecurity/trivy-action@master
        
      - name: Log in to the Container registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [ai-rca-engine, incident-summarizer, chatbot-api, alert-router, sre-copilot-ui]
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Deploy Services
        run: |
          echo "Deploying ${{ matrix.service }} to Azure Container Apps..."
          
          # Determine target port based on service
          TARGET_PORT=80
          if [ "${{ matrix.service }}" == "alert-router" ]; then TARGET_PORT=8001; fi
          if [ "${{ matrix.service }}" == "ai-rca-engine" ]; then TARGET_PORT=8002; fi
          if [ "${{ matrix.service }}" == "incident-summarizer" ]; then TARGET_PORT=8003; fi
          if [ "${{ matrix.service }}" == "chatbot-api" ]; then TARGET_PORT=8000; fi
          
          # Deploy or update the container app
          az containerapp up \
            --name ${{ matrix.service }} \
            --resource-group rg-aisre-dev \
            --environment cae-aisre-dev \
            --image ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest \
            --ingress external \
            --target-port $TARGET_PORT \
            --env-vars OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
                       GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
                       LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }}

  deploy-grafana:
    name: Deploy Grafana Dashboard
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Deploy Grafana
        run: |
          echo "Deploying Grafana to Azure Container Apps..."
          az containerapp up \
            --name grafana-dashboard \
            --resource-group rg-aisre-dev \
            --environment cae-aisre-dev \
            --image grafana/grafana-oss:latest \
            --ingress external \
            --target-port 3000 \
            --env-vars GF_SECURITY_ADMIN_PASSWORD=admin123 \
                       GF_SERVER_DOMAIN=grafana-dashboard.agreeablepebble-45923bcd.centralindia.azurecontainerapps.io \
                       GF_SERVER_ROOT_URL=https://grafana-dashboard.agreeablepebble-45923bcd.centralindia.azurecontainerapps.io/ \
                       GF_SECURITY_COOKIE_SAMESITE=lax \
                       GF_SECURITY_COOKIE_SECURE=true \
                       GF_SECURITY_CSRF_TRUSTED_ORIGINS=grafana-dashboard.agreeablepebble-45923bcd.centralindia.azurecontainerapps.io
