version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - ai-sre-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    networks:
      - ai-sre-net

  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - ai-sre-net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - ai-sre-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    restart: unless-stopped
    networks:
      - ai-sre-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - ai-sre-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - ai-sre-net

  alert-router:
    build:
      context: ./services/alert-router
    container_name: alert-router
    ports:
      - "8001:8000"
    restart: unless-stopped
    networks:
      - ai-sre-net
    depends_on:
      - ai-rca-engine

  ai-rca-engine:
    build:
      context: ./services/ai-rca-engine
    container_name: ai-rca-engine
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy-key-for-local-dev}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=ai-sre-copilot
    ports:
      - "8002:8000"
    restart: unless-stopped
    networks:
      - ai-sre-net

  remediation-engine:
    build:
      context: ./services/remediation-engine
    container_name: remediation-engine
    ports:
      - "8003:8000"
    restart: unless-stopped
    networks:
      - ai-sre-net

  incident-summarizer:
    build:
      context: ./services/incident-summarizer
    container_name: incident-summarizer
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy-key-for-local-dev}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=ai-sre-copilot
    ports:
      - "8004:8000"
    restart: unless-stopped
    networks:
      - ai-sre-net

  drift-detector:
    build:
      context: ./services/drift-detector
    container_name: drift-detector
    ports:
      - "8005:8000"
    restart: unless-stopped
    networks:
      - ai-sre-net

  chatbot-api:
    build:
      context: ./services/chatbot-api
    container_name: chatbot-api
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy-key-for-local-dev}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=ai-sre-copilot
    ports:
      - "8006:8000"
    restart: unless-stopped
    networks:
      - ai-sre-net

  sre-copilot-ui:
    build:
      context: ./services/sre-copilot-ui
    container_name: sre-copilot-ui
    ports:
      - "3002:80"
    restart: unless-stopped
    networks:
      - ai-sre-net

networks:
  ai-sre-net:
    driver: bridge
